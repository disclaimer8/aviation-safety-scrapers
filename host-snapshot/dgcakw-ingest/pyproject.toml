[project]
name = "dgcakw-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dgcakw_ingest*"]

[project.scripts]
dgcakw-ingest = "dgcakw_ingest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
