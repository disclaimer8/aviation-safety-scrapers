[project]
name = "ipiaam-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ipiaam-ingest = "ipiaam_ingest.cli:main"

[tool.setuptools.packages.find]
include = ["ipiaam_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
