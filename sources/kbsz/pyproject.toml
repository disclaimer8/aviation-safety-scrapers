[project]
name = "kbsz-ingest"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["kbsz_batch_download", "kbsz_batch_v2", "kbsz_fetch_v3", "kbsz_hu_ingest", "kbsz_parallel_fetch", "kbsz_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
