[project]
name = "aaisl-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aaisl_ingest*"]

[tool.setuptools.package-data]
aaisl_ingest = ["*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
