[project]
name = "aaib-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

# Without this, setuptools' flat-layout discovery finds both aaib_ingest and
# deploy/ and refuses to build: "Multiple top-level packages discovered".
# Every sibling package declares it; aaib was the one that did not, and
# nothing noticed because CI never installed the package.
[tool.setuptools.packages.find]
include = ["aaib_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
