[project]
name = "aaicth-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
aaicth-ingest = "aaicth_ingest.cli:main"

[tool.setuptools.packages.find]
include = ["aaicth_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
