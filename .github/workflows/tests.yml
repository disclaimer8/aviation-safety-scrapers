name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  common:
    # The canon, the vendoring gate, and the proof that each opted-in package
    # actually imports the shared policy. This job is the reason a fix to a
    # shared module cannot quietly apply to one package and not the rest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "httpx[socks]>=0.27" certifi "pytest>=8"
      - name: vendored copies match the canon
        run: python -m _common.sync --check
      - name: _common tests
        run: python -m pytest _common/tests -q

  sources:
    # Every Python source package, each with its own tests and offline
    # fixtures.
    #
    # Two things this job used to get wrong, both of which made it green for
    # the wrong reason:
    #
    #  1. It installed one fixed dependency set globally instead of each
    #     package's own extras. Patchright, Playwright and requests were never
    #     installed, so a package that needs them "passed" by never importing
    #     them — and cins and ntsbcarol worked only because the job injected
    #     httpx that their pyproject did not declare. `pip install -e` per
    #     package makes an undeclared dependency a red build.
    #  2. Nothing stopped a test reaching the network. CONTRIBUTING says tests
    #     must not, and none currently do (verified), but nothing enforced it,
    #     so the first one to try would have passed here and failed on a
    #     runner without egress. pytest-socket makes that a failure.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11 across the tree; test the ends of the
        # range rather than a single version that hides a syntax or stdlib
        # difference.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install "pytest>=8" pytest-socket
      - name: run each package's tests
        run: |
          set -uo pipefail
          failed=""
          for dir in sources/*/; do
            code=$(basename "$dir")
            if ! compgen -G "$dir/tests/test_*.py" > /dev/null; then
              echo "::warning title=No tests::$code has no tests"
              continue
            fi
            echo "::group::$code"
            # Install the package's own declared dependencies. A package that
            # forgets to declare one now fails here instead of riding on a
            # globally injected httpx.
            if ! pip install -q -e "$dir"; then
              echo "::endgroup::"
              echo "::error title=Install failed::$code"
              failed="$failed $code(install)"
              continue
            fi
            if ( cd "$dir" && PYTHONPATH=. timeout 300 python -m pytest -q \
                   --disable-socket --allow-unix-socket ); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error title=Tests failed::$code"
              failed="$failed $code"
            fi
          done
          if [ -n "$failed" ]; then
            echo "failing packages:$failed"
            exit 1
          fi

  sources-node:
    # The four Node scrapers. `npm ci` installs from the committed lockfile, so
    # a lockfile that drifts from package.json fails here rather than at build
    # time on the mini-PC.
    #
    # --no-audit is gone: this job exists because every open Dependabot alert
    # had accumulated in these packages, and silencing the audit in the one
    # place that runs them defeats the point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: run each package's tests
        run: |
          set -uo pipefail
          failed=""
          for dir in sources-node/*/; do
            code=$(basename "$dir")
            echo "::group::$code"
            if ( cd "$dir" && npm ci --no-fund && timeout 300 npm test ); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error title=Tests failed::$code"
              failed="$failed $code"
            fi
          done
          if [ -n "$failed" ]; then
            echo "failing packages:$failed"
            exit 1
          fi

  sources-node-audit:
    # Reported separately so a known-vulnerable transitive dependency is
    # visible without blocking every unrelated PR on it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit
        run: |
          for dir in sources-node/*/; do
            echo "::group::$(basename "$dir")"
            ( cd "$dir" && npm ci --no-audit --no-fund >/dev/null && npm audit --audit-level=high ) || true
            echo "::endgroup::"
          done

  sources-go:
    # The Go module per directory that has a go.mod: the aircrash scraper and
    # the control plane. go-version-file keeps each module on the toolchain it
    # declares instead of a version pinned here that silently drifts.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [sources-go/aircrash, control-plane]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./...
